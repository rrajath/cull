name: Build

# Build-only validation on every push to master: assembles both variants, publishes nothing.
# Releases are cut by pushing a v* tag, handled by release.yml.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      # No keystore here: release falls back to debug signing (see app/build.gradle.kts),
      # which is enough to validate that R8 and resource shrinking succeed.
      - name: Build release and debug APKs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew assembleRelease assembleDebug
