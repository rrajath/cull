name: Build

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Lowercase app name used in CI artifact names: {APP_NAME}-v{version}-{variant}.apk
  APP_NAME: cull

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `git rev-list --count HEAD` (used for versionName/versionCode) is accurate.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      # Computed exactly once, then reused for versionName/versionCode (via app/build.gradle.kts,
      # which both read this same git-commit-count formula), the Sentry release, and the GH release tag.
      - name: Compute version
        id: version
        run: |
          VERSION="$(./gradlew -q printVersionName | tail -n1)"
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release and debug APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.version.outputs.version }}
        run: ./gradlew assembleRelease assembleDebug

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # CI-only artifact naming: {APP_NAME}-v{version}-{variant}.apk (e.g. cull-v1.0.60-release.apk).
      # Local builds keep Gradle's default app-{variant}.apk names.
      - name: Rename APKs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for VARIANT in release debug; do
            SRC="app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
            DEST="dist/${APP_NAME}-v${VERSION}-${VARIANT}.apk"
            test -f "$SRC" || { echo "Missing $SRC"; exit 1; }
            mv "$SRC" "$DEST"
            echo "Built $DEST"
          done

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            "dist/${APP_NAME}-v${VERSION}-release.apk" \
            "dist/${APP_NAME}-v${VERSION}-debug.apk" \
            --title "v$VERSION" \
            --generate-notes
